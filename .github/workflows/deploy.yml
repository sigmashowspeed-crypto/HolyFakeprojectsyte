name: Saytni GitHub Pages sahifasiga joylash

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4
      - name: pnpm tayyorlash
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Node.js tayyorlash
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Kutubxonalarni o'rnatish
        run: pnpm install --frozen-lockfile
      - name: Saytni yig'ish
        run: pnpm run build
      - name: Pages uchun tayyorlash
        uses: actions/configure-pages@v5
      - name: Tayyor saytni yuklash
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Saytni nashr qilish
        id: deployment
        uses: actions/deploy-pages@v4
